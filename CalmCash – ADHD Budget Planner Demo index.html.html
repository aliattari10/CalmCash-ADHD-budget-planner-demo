<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CalmCash – Demo</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1f2937;--mu:#6b7280;--ac:#4f46e5;--ok:#059669;--wa:#d97706;--er:#dc2626;--bd:#e5e7eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ac:#818cf8;--ok:#34d399;--wa:#fbbf24;--er:#f87171;--bd:#374151;color-scheme:dark}}
:root[data-theme=dark]{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ac:#818cf8;--ok:#34d399;--wa:#fbbf24;--er:#f87171;--bd:#374151;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:0 0 10px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.lay{display:grid;grid-template-columns:210px 1fr;gap:16px;align-items:start}.tabs{display:flex;flex-direction:column;gap:6px;position:sticky;top:12px}@media(max-width:700px){.lay{grid-template-columns:1fr}.tabs{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}.cd{min-height:56px;font-size:10px}}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px;border-radius:10px;text-align:left;font-size:15px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.big{font-size:34px;font-weight:700;line-height:1.1}.mu{color:var(--mu);font-size:14px}
.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}
.bar{height:14px;background:var(--bd);border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok);transition:width .4s}
label{display:block;font-size:14px;color:var(--mu);margin:8px 0 2px}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
button.b{background:var(--ac);color:#fff;border:0;padding:11px 16px;border-radius:10px;font-size:16px;cursor:pointer;margin-top:10px}
button.s{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:6px 10px;border-radius:8px;cursor:pointer}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.li .n{flex:1}.li input[type=checkbox]{width:24px;height:24px}
.paid{opacity:.5;text-decoration:line-through}
.demo{background:var(--ac);color:#fff;padding:10px 14px;border-radius:12px;margin-bottom:12px;text-align:center}.demo a{color:#fff;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cd{min-height:78px;border:1px solid var(--bd);border-radius:8px;padding:4px;font-size:12px;overflow:hidden;background:var(--bg)}.cd.td{border:2px solid var(--ac)}.cd.e{border:0;background:none}.ch{background:var(--ac);color:#fff;border-radius:4px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch.p{opacity:.45;text-decoration:line-through}.ch.g{background:var(--ok)}.ch.pd{background:var(--wa)}.cs{color:var(--er);margin-top:2px}.wd{text-align:center;font-size:12px;color:var(--mu)}.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--bd);cursor:pointer;padding:0;flex:none;min-width:0}.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9}.toast button{margin-left:8px}
</style></head><body><div class="w">
<div class="demo">🎬 Demo version: sample data only, nothing is saved. <a id="buy" href="#" target="_blank" rel="noopener">Get the full version on Etsy</a></div>
<div class="top"><h1>🧠 CalmCash</h1><div><button class="s" onclick="theme()">🌓</button></div></div>
<div class="lay"><nav class="tabs" id="tabs"></nav><main id="v"></main></div>
<p class="mu" style="text-align:center">Demo: try anything. Changes are not saved, refresh to reset.</p>
</div>
<script>
const ETSY='https://www.etsy.com/';
const $=id=>document.getElementById(id);
const CATS=['Groceries','Transport','Fun / Dopamine','Eating out','Health','Other'];
const MULT={weekly:52/12,biweekly:26/12,semimonthly:2,monthly:1};
let mem=null;
function load(){try{}catch(e){}return mem||{income:{amt:0,freq:'biweekly'},goal:0,bills:[],debts:[],tx:[]}}
function norm(){S.goals=S.goals||[];S.theme=S.theme||{mode:'auto',ac:'',fs:16}}
let S=load();norm();let undoS=null,ys=new Date().getFullYear(),cm=new Date();cm.setDate(1);
function save(){mem=S}
const uid=()=>Math.random().toString(36).slice(2,9);
const $$=n=>'$'+(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const ym=d=>d.slice(0,7), today=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
function calc(){
 const inc=S.income.amt*MULT[S.income.freq];
 const bills=S.bills.reduce((a,b)=>a+ +b.amt,0), mins=S.debts.reduce((a,d)=>a+ +d.min,0);
 let pool=inc-bills-mins-S.goal;
 const m=ym(today()), mt=S.tx.filter(t=>ym(t.date)===m);
 const spent=mt.filter(t=>t.type==='exp').reduce((a,t)=>a+ +t.amt,0);
 const saved=mt.filter(t=>t.type==='sav').reduce((a,t)=>a+ +t.amt,0);
 const now=new Date(), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), left=dim-now.getDate()+1;
 const extra=mt.filter(t=>t.type==='inc').reduce((a,t)=>a+ +t.amt,0);pool+=extra;const rem=pool-spent;
 return{inc,bills,mins,pool,spent,saved,extra,rem,left,daily:rem/left,mt};
}
let tab='home';
const TABS=[['home','🏠 Today'],['pay','💵 Paycheck'],['bills','🧾 Bills'],['debt','💳 Debts'],['env','✉️ Envelopes'],['goals','🎯 Goals'],['cal','📅 Calendar'],['spend','⚡ Log'],['hist','📊 Month'],['year','📆 Year'],['theme','🎨 Theme & Data']];
function render(){
 $('tabs').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('');
 $('tabs').insertAdjacentHTML('beforeend','<button onclick="loadSample()">✨ Load sample data</button>');$('v').innerHTML=V[tab]();applyTheme();
}
const V={
env(){const c=calc(),by={},E=S.env||{};c.mt.filter(t=>t.type==='exp').forEach(t=>by[t.cat]=(by[t.cat]||0)+ +t.amt);let capT=0;const rows=cats().map((k,i)=>{const cap=+E[k]||0,sp=by[k]||0;capT+=cap;const p=cap>0?Math.min(100,sp/cap*100):0,over=cap>0&&sp>cap;return`<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><div class="row" style="align-items:center"><b>${esc(k)}</b><span>${$$(sp)} spent</span><input type="number" step="any" min="0" placeholder="Cap $" value="${cap||''}" onchange="setCap(${i},this.value)"></div>${cap>0?`<div class="bar"><i style="width:${p}%;background:var(--${over?'wa':'ok'})"></i></div><div class="mu">${over?'Over by '+$$(sp-cap)+'. Just information, nothing is wrong.':$$(cap-sp)+' left'}</div>`:'<div class="mu">No cap. Set one for a gentle line to notice.</div>'}</div>`}).join('');return`<div class="card"><h2>Envelopes</h2><p class="mu">A cap for each kind of spending this month. It is a line to notice, not a wall. Nothing moves or gets reserved.</p>${rows}</div><div class="card"><div class="mu">Caps total</div><b>${$$(capT)}</b> <span class="mu">of ${$$(Math.max(c.pool,0))} safe to spend this month</span>${c.pool>0&&capT>c.pool?'<p class="wa">Your caps add up to more than your safe-to-spend. Lower one or two.</p>':''}</div>`},
year(){const rows=[],c=calc();let te=0,ts=0,mx=1;for(let m=0;m<12;m++){const p=ys+'-'+String(m+1).padStart(2,'0'),t=S.tx.filter(x=>x.date.slice(0,7)===p),e=t.filter(x=>x.type==='exp').reduce((a,x)=>a+ +x.amt,0),s=t.filter(x=>x.type==='sav').reduce((a,x)=>a+ +x.amt,0);te+=e;ts+=s;mx=Math.max(mx,e,s);rows.push([m,e,s])}return`<div class="card"><div class="row" style="align-items:center;justify-content:space-between"><button class="s" style="flex:none;min-width:0" onclick="ys--;render()">◀</button><h2 style="margin:0">${ys}</h2><button class="s" style="flex:none;min-width:0" onclick="ys++;render()">▶</button></div><div class="g" style="margin-top:10px"><div><div class="mu">Estimated yearly income</div><b>${$$(c.inc*12)}</b></div><div><div class="mu">Bills + debt minimums / year</div><b>${$$((c.bills+c.mins)*12)}</b></div><div><div class="mu">Spent this year</div><b>${$$(te)}</b></div><div><div class="mu">Saved this year</div><b class="ok">${$$(ts)}</b></div></div></div><div class="card"><h2>Month by month</h2>${rows.map(r=>`<div><div class="row" style="justify-content:space-between"><span>${new Date(ys,r[0],1).toLocaleString(undefined,{month:'long'})}</span><span>${$$(r[1])} spent · <span class="ok">${$$(r[2])} saved</span></span></div><div class="bar"><i style="width:${r[1]/mx*100}%;background:var(--er)"></i></div><div class="bar" style="height:8px"><i style="width:${r[2]/mx*100}%"></i></div></div>`).join('')}</div>`},
goals(){const now=new Date();return`<div class="card"><h2>Savings goals</h2>${S.goals.map(g=>{const p=g.target>0?Math.min(100,g.saved/g.target*100):0,left=Math.max(0,g.target-g.saved);let note='';if(g.date&&left>0){const dt=new Date(g.date),mo=Math.max(1,(dt.getFullYear()-now.getFullYear())*12+dt.getMonth()-now.getMonth());note=` · save ${$$(left/mo)}/mo to hit ${g.date}`}return`<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><div class="row" style="align-items:center"><b>${esc(g.name)}</b><span>${$$(g.saved)} of ${$$(g.target)}</span><button class="s" style="flex:none;min-width:0" onclick="rm('goals','${g.id}')">✕</button></div><div class="bar"><i style="width:${p}%"></i></div><div class="row" style="align-items:center"><span class="mu">${p>=100?'🎉 Goal reached!':p.toFixed(0)+'% there'+note}</span><input type="number" id="gp${g.id}" placeholder="Add $" step="any"><button class="s" onclick="gAdd('${g.id}')">Add to goal</button></div></div>`}).join('')||'<p class="mu">No goals yet. Pick one small thing to save for.</p>'}</div><div class="card"><h2>New goal</h2><div class="row"><input id="gn" placeholder="Name (Emergency fund)"><input id="gt" type="number" placeholder="Target $" step="any"><input id="gs" type="number" placeholder="Saved so far $" step="any"><input id="gd" type="date"></div><button class="b" onclick="addGoal()">Add goal</button></div>`},
cal(){const y=cm.getFullYear(),m=cm.getMonth(),dim=new Date(y,m+1,0).getDate(),first=new Date(y,m,1).getDay(),ms=y+'-'+String(m+1).padStart(2,'0');let h='';const pdays=paydays(y,m,dim);for(let i=0;i<first;i++)h+='<div class="cd e"></div>';for(let d=1;d<=dim;d++){const ds=ms+'-'+String(d).padStart(2,'0'),bl=S.bills.filter(b=>Math.min(+b.due,dim)===d),sp=S.tx.filter(t=>t.date===ds&&t.type==='exp').reduce((a,t)=>a+ +t.amt,0),gl=S.goals.filter(g=>g.date===ds),pd=pdays.includes(d);h+=`<div class="cd${ds===today()?' td':''}"><b>${d}</b>${pd?'<div class="ch pd">💵 Payday</div>':''}${bl.map(b=>`<div class="ch ${b.paid?'p':''}">${b.sub?'🔁':'🧾'} ${esc(b.name)}</div>`).join('')}${gl.map(g=>`<div class="ch g">🎯 ${esc(g.name)}</div>`).join('')}${sp?`<div class="cs">−${$$(sp)}</div>`:''}</div>`}return`<div class="card"><div class="row" style="align-items:center;justify-content:space-between"><button class="s" style="flex:none;min-width:0" onclick="cmv(-1)">◀</button><h2 style="margin:0;text-align:center">${cm.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><button class="s" style="flex:none;min-width:0" onclick="cmv(1)">▶</button></div><div class="cal" style="margin-top:10px">${['S','M','T','W','T','F','S'].map(x=>`<div class="wd">${x}</div>`).join('')}${h}</div><p class="mu">🧾 bills due · 🎯 goal dates · red = money spent · 🔁 subscriptions · 💵 payday</p></div>`},
theme(){const t=S.theme,cols=['#4f46e5','#0ea5e9','#059669','#d97706','#db2777','#7c3aed'];return`<div class="card"><h2>Look and feel</h2><label>Mode</label><div class="row">${['auto','light','dark'].map(k=>`<button class="${t.mode===k?'b':'s'}" style="margin:0" onclick="setT('mode','${k}')">${k}</button>`).join('')}</div><label>Accent color</label><div class="row" style="align-items:center">${cols.map(c=>`<button class="sw" style="background:${c}" onclick="setT('ac','${c}')"></button>`).join('')}<input type="color" style="flex:none;width:54px;padding:2px" value="${t.ac||'#4f46e5'}" onchange="setT('ac',this.value)"><button class="s" style="flex:none" onclick="setT('ac','')">Reset</button></div><label>Text size: ${t.fs}px</label><input type="range" min="14" max="22" value="${t.fs}" onchange="setT('fs',+this.value)"></div><div class="card"><h2>Data</h2><p class="mu">Sample data replaces what you have now. You can undo right after.</p><div class="row"><button class="b" onclick="loadSample()">✨ Load sample data</button><button class="s" onclick="clearAll()">Clear all data</button></div></div>`},
home(){const c=calc();
 const ratio=c.pool>0?Math.min(c.spent/c.pool,1):1;
 const cls=c.rem<0?'er':ratio>.8?'wa':'ok';
 const msg=c.rem<0?'You\u2019re over your safe amount. No shame, just pause on extras for a few days.':ratio>.8?'Heads up: you\u2019re close to your limit this month.':'Nice. You\u2019re comfortably inside your safe zone.';
 const due=S.bills.filter(b=>!b.paid).sort((a,b)=>a.due-b.due);
 const dom=new Date().getDate(), next=due.find(b=>b.due>=dom)||due[0];
 return`${payCard()}<div class="card"><div class="mu">Safe to spend this month</div><div class="big ${cls}">${$$(c.rem)}</div>
 <div class="bar"><i style="width:${ratio*100}%;background:var(--${cls})"></i></div><div>${msg}</div>
 <div class="mu" style="margin-top:6px">About <b>${$$(Math.max(c.daily,0))}</b> per day for the next ${c.left} days</div></div>
 <div class="g"><div class="card"><div class="mu">Monthly income</div><div class="big" style="font-size:24px">${$$(c.inc)}</div></div>
 <div class="card"><div class="mu">Bills + debt minimums + savings goal</div><div class="big" style="font-size:24px">${$$(c.bills+c.mins+ +S.goal)}</div></div>
 <div class="card"><div class="mu">Next unpaid bill</div><div class="big" style="font-size:24px">${next?next.name:'All paid 🎉'}</div><div class="mu">${next?$$(next.amt)+' · due day '+next.due:''}</div></div></div>
 ${c.inc===0?'<div class="card">👋 Start in <b>Paycheck</b>: enter what you earn. Everything else fills itself in.</div>':''}${charts(c)}`},
pay(){const c=calc();return`<div class="card"><h2>Your paycheck</h2>
 <div class="row"><div><label>Take-home per paycheck ($)</label><input type="number" min="0" step="any" value="${S.income.amt||''}" onchange="S.income.amt=+this.value;save();render()"></div>
 <div><label>How often?</label><select onchange="S.income.freq=this.value;save();render()">${Object.keys(MULT).map(k=>`<option ${S.income.freq===k?'selected':''}>${k}</option>`).join('')}</select></div></div>
 <label>Next payday (shows on calendar)</label><input type="date" value="${S.income.next||''}" onchange="S.income.next=this.value;save();render()"><label>In your account right now ($)</label><input type="number" step="any" value="${S.bal==null?'':S.bal}" onchange="S.bal=this.value===''?null:+this.value;S.balTs=Date.now();save();render()"><label>Already set aside ($, optional)</label><input type="number" step="any" value="${S.aside||''}" onchange="S.aside=+this.value||0;save();render()"><label>Monthly savings goal ($)</label><input type="number" min="0" step="any" value="${S.goal||''}" onchange="S.goal=+this.value;save();render()"></div>
 <div class="card"><h2>Where your month goes</h2>
 ${[['Bills',c.bills],['Debt minimums',c.mins],['Savings goal',S.goal],['Safe to spend',c.pool]].map(r=>`<div class="li"><span class="n">${r[0]}</span><b class="${r[0]==='Safe to spend'&&r[1]<0?'er':''}">${$$(r[1])}</b></div>`).join('')}
 ${c.pool<0?'<p class="er">Your commitments are more than your income. Try lowering the savings goal first, then review bills.</p>':''}</div>`},
bills(){const tot=S.bills.reduce((a,b)=>a+ +b.amt,0);
 return`<div class="card"><h2>Bills <span class="mu">${$$(tot)}/mo</span></h2>
 ${S.bills.sort((a,b)=>a.due-b.due).map(b=>`<div class="li"><input type="checkbox" ${b.paid?'checked':''} onchange="tg('${b.id}')"><span class="n ${b.paid?'paid':''}">${b.sub?'🔁 ':''}${esc(b.name)}<br><span class="mu">${b.sub?'Subscription':'Bill'} · due day ${b.due}</span></span><b>${$$(b.amt)}</b><button class="s" onclick="rm('bills','${b.id}')">✕</button></div>`).join('')||'<p class="mu">No bills yet.</p>'}
 <button class="s" onclick="rs()" style="margin-top:8px">Reset all to unpaid (new month)</button></div>
 <div class="card"><h2>Add a bill</h2><div class="row"><input id="bn" placeholder="Name (Rent)"><input id="ba" type="number" placeholder="Amount" step="any"><input id="bd" type="number" min="1" max="31" placeholder="Due day"><select id="bt"><option value="bill">Bill</option><option value="sub">Subscription</option></select></div><button class="b" onclick="addBill()">Add bill</button></div>`},
debt(){const tb=S.debts.reduce((a,d)=>a+ +d.bal,0);
 return`<div class="card"><h2>Debts <span class="mu">${$$(tb)} left</span></h2>
 ${S.debts.map(d=>{const p=d.start>0?Math.min(100,(1-d.bal/d.start)*100):0;const po=payoff(d);
 return`<div style="padding:10px 0;border-bottom:1px solid var(--bd)"><div class="row" style="align-items:center"><b>${esc(d.name)}</b><span>${$$(d.bal)} left</span><span class="mu">${d.rate||0}% APR · min ${$$(d.min)}</span><button class="s" style="flex:none;min-width:0" onclick="rm('debts','${d.id}')">✕</button></div>
 <div class="bar"><i style="width:${p}%"></i></div><div class="row" style="align-items:center"><span class="mu">${p.toFixed(0)}% paid · ${po.txt}</span><input type="number" id="dp${d.id}" placeholder="Payment $" step="any"><button class="s" onclick="payDebt('${d.id}')">Record payment</button></div></div>`}).join('')||'<p class="mu">No debts tracked.</p>'}
 <p class="mu">Tip: pay the minimums on all, then put extra toward the smallest balance for quick wins.</p></div>
 <div class="card"><h2>Add a debt</h2><div class="row"><input id="dn" placeholder="Name (Credit card)"><input id="db" type="number" placeholder="Balance" step="any"><input id="dm" type="number" placeholder="Monthly minimum" step="any"><input id="dr" type="number" placeholder="Interest rate % (APR)" step="any"></div><button class="b" onclick="addDebt()">Add debt</button></div>`},
spend(){return`<div class="card"><h2>Quick log</h2>
 <label>What was it?</label><input id="td" placeholder="Coffee, Target run…">
 <div class="row"><div><label>Amount ($)</label><input id="ta" type="number" step="any"><div class="row" style="gap:6px;margin-top:6px">${[1,5,10,20].map(v=>`<button class="s" style="min-width:0" onclick="qa(${v})">+${v}</button>`).join('')}</div></div><div><label>Type</label><select id="tt" onchange="$('tc').style.display=this.value==='exp'?'':'none'"><option value="exp">Expense</option><option value="sav">Savings</option><option value="inc">Money in (refund, gift, side income)</option></select></div></div>
 <div class="row"><div><label>Day</label><input id="tdt" type="date" value="${today()}"></div><div><label>Note (optional)</label><input id="tn"></div></div><div id="tc"><label>Category</label><select id="tcat">${cats().map(c=>`<option>${c}</option>`).join('')}</select></div>
 <button class="b" onclick="addTx()">Add</button><p id="fb" class="ok"></p></div><div class="card"><h2>Latest entries</h2>${S.tx.slice(-5).reverse().map(t=>`<div class="li"><span class="n">${esc(t.desc)}<br><span class="mu">${t.date} · ${t.type==='sav'?'Savings':esc(t.cat)}${t.note?' · '+esc(t.note):''}</span></span><b>${$$(t.amt)}</b><button class="s" onclick="rm('tx','${t.id}')">✕</button></div>`).join('')||'<p class="mu">Nothing yet.</p>'}</div><div class="card"><h2>My categories</h2><div class="row" style="gap:6px">${cats().map((c,i)=>`<button class="s" style="flex:none;min-width:0" onclick="delCat(${i})">${esc(c)} ✕</button>`).join('')}</div><div class="row"><input id="nc" placeholder="New category (Pets, Gifts…)"><button class="b" style="margin:0" onclick="addCat()">Add category</button></div></div>`},
hist(){const c=calc();const by={};c.mt.filter(t=>t.type==='exp').forEach(t=>by[t.cat]=(by[t.cat]||0)+ +t.amt);
 const mx=Math.max(1,...Object.values(by));
 return`<div class="card"><h2>This month</h2><div class="g"><div><div class="mu">Spent</div><b>${$$(c.spent)}</b></div><div><div class="mu">Saved</div><b class="ok">${$$(c.saved)}</b></div><div><div class="mu">Came in (extra)</div><b class="ok">${$$(c.extra)}</b></div></div></div>
 <div class="card"><h2>By category</h2>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><div class="row" style="justify-content:space-between"><span>${esc(k)}</span><b>${$$(v)}</b></div><div class="bar"><i style="width:${v/mx*100}%;background:var(--ac)"></i></div></div>`).join('')||'<p class="mu">Nothing logged yet.</p>'}</div>
 <div class="card"><h2>History</h2>${c.mt.slice().reverse().map(t=>`<div class="li"><span class="n">${esc(t.desc)}<br><span class="mu">${t.date} · ${t.type==='sav'?'Savings':esc(t.cat)}${t.note?' · '+esc(t.note):''}</span></span><b class="${t.type==='exp'?'':'ok'}">${$$(t.amt)}</b><button class="s" onclick="rm('tx','${t.id}')">✕</button></div>`).join('')||'<p class="mu">Empty.</p>'}</div>`}
};
function cmv(n){cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);render()}

function gAdd(id){const v=+$('gp'+id).value;if(!v)return;const g=S.goals.find(x=>x.id===id);g.saved+=v;S.tx.push({id:uid(),ts:Date.now(),date:today(),desc:'Goal: '+g.name,amt:v,type:'sav',cat:'Savings'});save();render()}
function setT(k,v){S.theme[k]=v;save();render()}
function applyTheme(){const r=document.documentElement,t=S.theme;if(t.mode==='auto')delete r.dataset.theme;else r.dataset.theme=t.mode;if(t.ac)r.style.setProperty('--ac',t.ac);else r.style.removeProperty('--ac');document.body.style.fontSize=t.fs+'px'}
function toast(m,u){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.innerHTML=esc(m)+(u?' <button class="s" onclick="undo()">Undo</button>':'');t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',7000)}
function undo(){if(undoS){S=JSON.parse(undoS);undoS=null;save();render();toast('Restored')}}
function clearAll(){undoS=JSON.stringify(S);S={income:{amt:0,freq:'biweekly'},goal:0,bills:[],debts:[],tx:[],goals:[],theme:S.theme};save();render();toast('All data cleared. ',1)}
function loadSample(){undoS=JSON.stringify(S);const n=new Date(),p=today().slice(0,7),dn=n.getDate(),dt=k=>p+'-'+String(Math.max(1,dn-k)).padStart(2,'0'),fut=k=>new Date(Date.now()+k*864e5).toISOString().slice(0,10),B=(name,amt,due)=>({id:uid(),name,amt,due,paid:due<dn}),T=(k,desc,cat,amt,type)=>({id:uid(),date:dt(k),desc,cat,amt,type:type||'exp'});S={income:{amt:1400,freq:'biweekly',next:fut(5)},goal:300,bal:900,balTs:Date.now(),aside:0,env:{'Groceries':250,'Eating out':60,'Fun / Dopamine':50},theme:S.theme,bills:[B('Rent',1100,1),B('Phone',55,12),B('Internet',60,15),B('Electric',90,20),{...B('Streaming',18,25),sub:true}],debts:[{id:uid(),name:'Credit card',bal:2400,start:3000,min:75,rate:22.9},{id:uid(),name:'Student loan',bal:8200,start:9000,min:120,rate:5.5}],goals:[{id:uid(),name:'Emergency fund',target:1000,saved:350,date:fut(120)},{id:uid(),name:'Weekend trip',target:600,saved:180,date:fut(60)}],tx:[T(6,'Groceries','Groceries',62),T(5,'Coffee','Eating out',6.5),T(4,'Gas','Transport',40),T(3,'New game','Fun / Dopamine',29),T(2,'Pharmacy','Health',18),T(1,'Transfer to savings','Savings',100,'sav'),T(0,'Lunch out','Eating out',14),T(2,'Refund from store','Money in',20,'inc')]};tab='home';save();render();toast('Sample data loaded. ',1)}
function cats(){return S.cats&&S.cats.length?S.cats:CATS}
function addCat(){const v=$('nc').value.trim();if(!v)return;const l=cats().slice();if(!l.includes(v))l.push(v);S.cats=l;save();render()}
function delCat(i){const l=cats().slice();if(l.length<=1)return;l.splice(i,1);S.cats=l;save();render()}
function payoff(d){const r=(+d.rate||0)/1200,b=+d.bal,m=+d.min;if(b<=0)return{txt:'paid off 🎉'};if(!m)return{txt:'add a minimum payment'};if(!r)return{txt:'~'+Math.ceil(b/m)+' months at minimum'};if(m<=b*r)return{txt:'⚠ minimum does not cover interest ('+$$(b*r)+'/mo)'};const n=Math.ceil(-Math.log(1-b*r/m)/Math.log(1+r));return{txt:'~'+n+' months at minimum · about '+$$(n*m-b)+' interest'}}
function paydays(y,m,dim){const f=S.income.freq,nx=S.income.next;if(!nx)return[];const a=new Date(nx+'T00:00:00'),o=[];for(let d=1;d<=dim;d++){const df=Math.round((new Date(y,m,d)-a)/864e5);let ok=false;if(f==='weekly')ok=df%7===0;else if(f==='biweekly')ok=df%14===0;else if(f==='semimonthly')ok=d===15||d===dim;else ok=d===Math.min(a.getDate(),dim);if(ok)o.push(d)}return o}
function qa(v){const e=$('ta');e.value=Math.round(((+e.value||0)+v)*100)/100}
function setCap(i,v){const k=cats()[i];S.env=S.env||{};S.env[k]=+v||0;save();render()}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function isPD(dt){const f=S.income.freq,a=new Date(S.income.next+'T00:00:00'),df=Math.round((dt-a)/864e5),d=dt.getDate(),dim=new Date(dt.getFullYear(),dt.getMonth()+1,0).getDate();if(f==='weekly')return df%7===0;if(f==='biweekly')return df%14===0;if(f==='semimonthly')return d===15||d===dim;return d===Math.min(a.getDate(),dim)}
function pp(){if(!S.income.next||S.bal==null)return null;const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());let i=1,nd=null;for(;i<=62;i++){const d=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()+i);if(isPD(d)){nd=d;break}}if(!nd)return null;const dom=t0.getDate();let bills=0;S.bills.forEach(b=>{const a=+b.amt;if(!b.paid&&+b.due<dom)bills+=a;for(let k=0;k<i;k++){const d=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate()+k),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();if(Math.min(+b.due,dim)===d.getDate()&&(d.getMonth()!==t0.getMonth()||!b.paid)){bills+=a;break}}});const cur=S.tx.filter(t=>t.ts>(S.balTs||0)).reduce((s,t)=>s+(t.type==='inc'?1:-1)*(+t.amt),+S.bal),aside=+S.aside||0,safe=cur-bills-aside;return{days:i,date:ymd(nd),cur,bills,aside,safe,per:safe/i}}
function payCard(){const p=pp();if(!p)return'<div class="card"><b>Want a payday-based number?</b><div class="mu">In Paycheck, set your next payday and what is in your account now.</div></div>';const cls=p.safe<0?'er':'ok';return`<div class="card"><div class="mu">Safe to spend today</div><div class="big ${cls}">${$$(Math.max(p.per,0))}</div><div class="mu">${p.days} day${p.days>1?'s':''} until payday (${p.date})</div>${p.safe<0?'<p class="er">Bills before payday are more than what is in your account. Pause extras and check the Bills tab.</p>':''}<div class="row" style="margin-top:8px"><div><div class="mu">Safe until payday</div><b class="${cls}">${$$(p.safe)}</b></div><div><div class="mu">In account now</div><b>${$$(p.cur)}</b></div><div><div class="mu">Bills before payday</div><b>${$$(p.bills)}</b></div></div><details style="margin-top:8px"><summary class="mu">How is this worked out?</summary><p class="mu">Account now (${$$(p.cur)}) minus unpaid bills due before payday (${$$(p.bills)}) minus set aside (${$$(p.aside)}) = ${$$(p.safe)}. Shared over ${p.days} days. Debt minimums and savings goals are not taken off here, so put that money in Set aside if you want it protected.</p></details></div>`}
function charts(c){const by={};c.mt.filter(t=>t.type==='exp').forEach(t=>by[t.cat]=(by[t.cat]||0)+ +t.amt);const ent=Object.entries(by).sort((a,b)=>b[1]-a[1]),tot=ent.reduce((a,e)=>a+e[1],0),COL=['#e07a6e','#6cb8cc','#9a80d8','#d9a441','#5aa874','#8fa1e0','#d98fb8','#9aa5b1'],R=52,C=2*Math.PI*R;let off=0;
const segs=ent.map((e,i)=>{const L=e[1]/tot*C,s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${COL[i%8]}" stroke-width="18" stroke-dasharray="${L} ${C-L}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=L;return s}).join('');
const legend=ent.map((e,i)=>`<div class="row" style="flex-wrap:nowrap;justify-content:space-between;min-width:0"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${COL[i%8]};margin-right:6px"></i>${esc(e[0])}</span><b>${$$(e[1])}</b></div>`).join('')||'<span class="mu">Nothing logged yet.</span>';
const came=c.inc+c.extra,kept=came-c.bills-c.mins-c.spent;
const now=new Date(),y=now.getFullYear(),mo=now.getMonth(),dim=new Date(y,mo+1,0).getDate(),td=now.getDate(),day=[];for(let d=1;d<=dim;d++){const ds=ymd(new Date(y,mo,d));day.push(c.mt.filter(t=>t.type==='exp'&&t.date===ds).reduce((a,t)=>a+ +t.amt,0))}
const dm=Math.max(...day),tall=day.indexOf(dm);
const bars=day.map((v,i)=>`<div style="flex:1;height:100%;display:flex;align-items:flex-end;background:var(--bg);border-radius:4px"><i style="display:block;width:100%;border-radius:4px;height:${v>0?Math.max(v/dm*100,6):0}%;background:${i+1===td?'var(--ac)':'#e07a6e'}"></i></div>`).join('');
const p=pp(),strip=day.map((v,i)=>`<div style="flex:1;height:100%;border-radius:4px;background:${i===dim-1?'var(--ok)':i+1===td?'var(--ac)':i+1<td?'#9db8e8':'var(--bd)'}"></div>`).join('');
const left=p?p.days:c.left,safe=p?p.safe:c.rem,per=p?p.per:c.daily;
const ms=[['Every bill covered before payday',!!p&&p.safe>=0],['A day without spending',day.slice(0,td-1).some(v=>v===0)],['A month with every bill ticked off',S.bills.length>0&&S.bills.every(b=>b.paid)],['A goal reached in full',S.goals.some(g=>g.target>0&&g.saved>=g.target)]],n=ms.filter(m=>m[1]).length;
return`<div class="card"><h2>The month so far</h2><div class="row" style="align-items:center;gap:16px"><div style="position:relative;flex:none;width:140px;min-width:140px"><svg viewBox="0 0 140 140" width="140" height="140"><circle r="52" cx="70" cy="70" fill="none" stroke="var(--bd)" stroke-width="18"/>${segs}</svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><span class="mu" style="font-size:11px">WENT OUT</span><b style="font-size:18px">${$$(tot)}</b></div></div><div style="flex:2;min-width:200px;display:grid;gap:6px">${legend}</div></div></div><div class="g"><div class="card" style="border-left:5px solid var(--ok)"><div class="mu">Came in</div><div class="big" style="font-size:26px">${$$(came)}</div></div><div class="card" style="border-left:5px solid #e07a6e"><div class="mu">Went out (spending)</div><div class="big" style="font-size:26px">${$$(c.spent)}</div></div><div class="card" style="border-left:5px solid var(--ac)"><div class="mu">Kept after bills and debt</div><div class="big ${kept<0?'er':''}" style="font-size:26px">${$$(kept)}</div></div></div><div class="card"><h2>Every day this month</h2><div style="display:flex;gap:3px;height:90px">${bars}</div><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span class="mu">1st</span><span class="mu">today: ${td}</span><span class="mu">${dim}th</span></div><p class="mu" style="font-style:italic">${dm>0?'The tallest day was '+new Date(y,mo,tall+1).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})+' at '+$$(dm):'No spending logged this month yet.'}</p></div><div class="g"><div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2>Run to payday</h2><span class="mu">${left} day${left===1?'':'s'} left</span></div><div style="display:flex;gap:3px;height:56px;margin-bottom:10px">${strip}</div><div class="li"><span class="n">${p?'Safe until payday':'Safe to spend left'}</span><b class="${safe<0?'er':''}">${$$(safe)}</b></div><div class="li"><span class="n">Each day from here</span><b>about ${$$(Math.max(per,0))}/day</b></div><div class="li"><span class="n">Logged so far</span><b>${c.spent>0?$$(c.spent):'nothing yet'}</b></div>${p?'':'<p class="mu">Add a payday and your account balance in Paycheck to count to your real payday.</p>'}</div><div class="card"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2>Milestones</h2><span class="mu">${n} of 4 reached</span></div>${ms.map(m=>`<div class="li"><span class="n">${m[0]}</span><b class="${m[1]?'ok':'mu'}">${m[1]?'reached ✓':'not yet'}</b></div>`).join('')}<p class="mu" style="font-style:italic">Milestones never count down or reset. They are worked out from what you have entered.</p></div></div>`}

 S.tx.push({id:uid(),ts:Date.now(),date:$('tdt').value||today(),desc:d,note:$('tn').value.trim(),amt:a,type:t,cat:t==='exp'?$('tcat').value:t==='inc'?'Money in':'Savings'});save();render();$('fb').textContent='✨ Logged! Nice work staying on top of it.'}
